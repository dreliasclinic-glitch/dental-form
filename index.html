<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שאלון רפואי - ד"ר אסעד אליאס</title>
    
    <!-- הגדרות אפליקציה לטאבלט (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="שאלון רפואי">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 820px;
            margin: auto;
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .logo-container {
            text-align: center;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .logo-container img {
            height: 135px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #0f766e;
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 10px 0;
        }
        fieldset {
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 8px;
            background-color: #ffffff;
        }
        legend {
            font-weight: 700;
            color: #0f766e;
            padding: 0 6px;
            font-size: 13px;
            background: #ffffff;
        }
        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }
        .row:last-child { margin-bottom: 0; }
        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 11.5px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 3px;
        }
        input[type="text"], input[type="date"], input[type="tel"], input[type="email"] {
            padding: 6px 8px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            width: 100%;
        }
        input[type="text"]:focus, input[type="date"]:focus, input[type="tel"]:focus, input[type="email"]:focus {
            border-color: #0d9488;
            background: #ffffff;
        }
        .grid-checkboxes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px 8px;
        }
        .checkbox-item {
            font-size: 11px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .checkbox-item input {
            width: 14px;
            height: 14px;
            accent-color: #0d9488;
            cursor: pointer;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11.5px;
            color: #334155;
            align-items: center;
            padding-top: 2px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .radio-item input {
            width: 14px;
            height: 14px;
            accent-color: #0d9488;
        }
        .sig-container {
            text-align: center;
            margin-top: 2px;
        }
        .canvas-wrapper {
            width: 100%;
            max-width: 480px;
            height: 110px;
            margin: 0 auto;
            position: relative;
        }
        canvas {
            border: 2px dashed #0d9488;
            border-radius: 8px;
            background: #f8fafc;
            touch-action: none;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .btn-container {
            text-align: center;
            margin-top: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .submit-btn {
            background-color: #0d9488;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2);
            flex: 1;
            max-width: 240px;
            transition: background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .submit-btn:active { background-color: #0f766e; }
        .wa-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
            flex: 1;
            max-width: 240px;
            transition: background-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .wa-btn:active { background-color: #128c7e; }
        .clear-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            border-radius: 6px;
            margin-top: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        @media print {
            .btn-container, .clear-btn {
                display: none !important;
            }
        }
        .hide-for-pdf {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container" id="form-content">
    <div class="logo-container">
        <img src="logo.png" alt="ד''ר אסעד אליאס" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'50\'><text x=\'50%\' y=\'50%\' font-size=\'16\' font-family=\'Arial\' text-anchor=\'middle\' fill=\'%230f766e\' dominant-baseline=\'middle\'>ד&quot;ר אסעד אליאס - מרפאת שיניים משולבת</text></svg>';">
    </div>

    <h2>שאלון רפואי / אנמנזה</h2>

    <fieldset>
        <legend>פרטי המתרפא</legend>
        <div class="row">
            <div class="field"><label>שם משפחה:</label><input type="text" id="lname" required></div>
            <div class="field"><label>שם פרטי:</label><input type="text" id="fname" required></div>
        </div>
        <div class="row">
            <div class="field"><label>תעודת זהות:</label><input type="text" id="id_num" required></div>
            <div class="field"><label>תאריך לידה:</label><input type="date" id="dob"></div>
        </div>
        <div class="row">
            <div class="field"><label>טלפון נייד:</label><input type="tel" id="phone"></div>
            <div class="field"><label>דוא"ל:</label><input type="email" id="email"></div>
        </div>
    </fieldset>

    <fieldset>
        <legend>שאלות רפואיות</legend>
        <div class="grid-checkboxes" id="conditions-grid"></div>
    </fieldset>

    <fieldset>
        <legend>פירוט רפואי ואלרגיות</legend>
        <div class="row">
            <div class="field"><label>האם אושפזת בבית חולים? מאיזו סיבה?</label><input type="text" id="q_hosp"></div>
            <div class="field"><label>האם אלרגי לתרופות / חומרי הרדמה? לאילו?</label><input type="text" id="q_allergies"></div>
        </div>
        <div class="row">
            <div class="field"><label>האם יש אלרגיה למתכות? לאילו?</label><input type="text" id="q_metal"></div>
            <div class="field"><label>האם נוטל תרופות או גלולות קבוע? אילו?</label><input type="text" id="q_meds"></div>
        </div>
    </fieldset>

    <fieldset>
        <legend>קופת חולים, ביטוח והגעה</legend>
        <div class="row">
            <div class="field">
                <label>קופת חולים:</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="kupa" value="כללית"> כללית</label>
                    <label class="radio-item"><input type="radio" name="kupa" value="מכבי"> מכבי</label>
                    <label class="radio-item"><input type="radio" name="kupa" value="מאוחדת"> מאוחדת</label>
                    <label class="radio-item"><input type="radio" name="kupa" value="לאומית"> לאומית</label>
                </div>
            </div>
            <div class="field">
                <label>חברת ביטוח:</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="insurance" value="הראל"> הראל</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="הפניקס"> הפניקס</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="מנורה"> מנורה</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="מגדל"> מגדל</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="כלל"> כלל</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="ללא"> ללא</label>
                </div>
            </div>
        </div>
        <div class="row" style="margin-top: 4px;">
            <div class="field">
                <label>איך הגעת למרפאה?</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="arrival" value="המלצה מחבר"> המלצה מחבר</label>
                    <label class="radio-item"><input type="radio" name="arrival" value="אינטרנט"> אינטרנט</label>
                    <label class="radio-item"><input type="radio" name="arrival" value="ביטוח"> ביטוח</label>
                </div>
            </div>
            <div class="field">
                <label>שם הממליץ:</label>
                <input type="text" id="recommender">
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>חתימת המתרפא</legend>
        <div class="sig-container">
            <div class="canvas-wrapper">
                <canvas id="sig-canvas"></canvas>
            </div>
            <button type="button" class="clear-btn" id="clear-btn" onclick="clearSignature()">נקה חתימה</button>
        </div>
    </fieldset>

    <div class="btn-container" id="action-buttons">
        <button type="button" class="submit-btn" id="save-btn" onclick="submitForm()">שמור טופס PDF</button>
        <button type="button" class="wa-btn" id="wa-btn" onclick="shareWhatsApp()">שתף קובץ PDF 📱</button>
    </div>
</div>

<script>
    const conditionsList = [
        "אנמיה", "מחלת הנפילה / עצבים", "מחלות ריאות / אסטמה", "גידולים",
        "מחלות עור", "סוכרת", "סחרחורות / התעלפויות", "נטייה לדימום / קרישה",
        "הקרנות / כימותרפיה", "בהריון", "בלוטת התריס", "לחץ דם גבוה",
        "מחלות לב / רשרוש", "מום לב / מסתם", "דלקת פרקים", "מחלת כליות",
        "מחלת כבד / צהבת", "מחלות פסיכיאטריות", "חום / שלשול ממושך", "הגדלת בלוטות",
        "מחלות מין", "איידס", "הפרעות בסגירת הפה", "השתלה"
    ];
    const grid = document.getElementById('conditions-grid');
    conditionsList.forEach(cond => {
        grid.innerHTML += `<label class="checkbox-item"><input type="checkbox" value="${cond}"> ${cond}</label>`;
    });

    const canvas = document.getElementById('sig-canvas');
    let signaturePad;

    function initSignaturePad() {
        const wrapper = canvas.parentElement;
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = wrapper.clientWidth * ratio;
        canvas.height = wrapper.clientHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        
        if (!signaturePad) {
            signaturePad = new SignaturePad(canvas, { penColor: '#0f766e' });
        } else {
            signaturePad.clear();
        }
    }

    window.addEventListener("load", initSignaturePad);
    window.addEventListener("resize", initSignaturePad);

    function clearSignature() { if (signaturePad) signaturePad.clear(); }

    function validateForm() {
        const fname = document.getElementById('fname').value.trim();
        const lname = document.getElementById('lname').value.trim();
        const idNum = document.getElementById('id_num').value.trim();

        if (!fname || !lname || !idNum) { 
            alert("נא למלא שם פרטי, שם משפחה ותעודת זהות."); 
            return false; 
        }
        if (signaturePad && signaturePad.isEmpty()) { 
            alert("נא לחתום על גבי הטופס לפני השליחה."); 
            return false; 
        }
        return true; 
    }

    function toggleButtonsForPdf(hide) {
        const btns = document.getElementById('action-buttons');
        const clearBtn = document.getElementById('clear-btn');
        if (hide) {
            btns.classList.add('hide-for-pdf');
            clearBtn.classList.add('hide-for-pdf');
        } else {
            btns.classList.remove('hide-for-pdf');
            clearBtn.classList.remove('hide-for-pdf');
        }
    }

    function submitForm() {
        if (!validateForm()) return;

        const fname = document.getElementById('fname').value.trim();
        const lname = document.getElementById('lname').value.trim();
        const idNum = document.getElementById('id_num').value.trim();
        const btn = document.getElementById('save-btn');
        
        btn.disabled = true;
        btn.innerText = "מפיק PDF...";

        toggleButtonsForPdf(true);

        const filename = `הצהרת_בריאות_${lname}_${fname}_${idNum}.pdf`;
        const element = document.getElementById('form-content');

        const opt = {
            margin:       [2, 2, 2, 2],
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            toggleButtonsForPdf(false);
            btn.disabled = false;
            btn.innerText = "שמור טופס PDF";
            alert("הטופס נשמר בהצלחה!");
            location.reload();
        }).catch(err => {
            console.error(err);
            toggleButtonsForPdf(false);
            btn.disabled = false;
            btn.innerText = "שמור טופס PDF";
            alert("שגיאה ביצירת הקובץ.");
        });
    }

    async function shareWhatsApp() {
        if (!validateForm()) return;

        const fname = document.getElementById('fname').value.trim();
        const lname = document.getElementById('lname').value.trim();
        const idNum = document.getElementById('id_num').value.trim();
        const btn = document.getElementById('wa-btn');

        btn.disabled = true;
        btn.innerText = "מכין קובץ לשיתוף...";

        toggleButtonsForPdf(true);

        const filename = `הצהרת_בריאות_${lname}_${fname}_${idNum}.pdf`;
        const element = document.getElementById('form-content');

        const opt = {
            margin:       [2, 2, 2, 2],
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
            const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
            toggleButtonsForPdf(false);
            const file = new File([pdfBlob], filename, { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: `הצהרת בריאות - ${lname} ${fname}`,
                    text: `הצהרת בריאות עבור ${lname} ${fname} (ת.ז: ${idNum})`
                });
                btn.disabled = false;
                btn.innerText = "שתף קובץ PDF 📱";
            } else {
                html2pdf().set(opt).from(element).save().then(() => {
                    const targetPhone = "972504244552";
                    const text = `הצהרת בריאות מצורפת עבור ${lname} ${fname} (ת.ז: ${idNum})`;
                    const waUrl = `https://api.whatsapp.com/send?phone=${targetPhone}&text=${encodeURIComponent(text)}`;
                    window.open(waUrl, '_blank');
                    btn.disabled = false;
                    btn.innerText = "שתף קובץ PDF 📱";
                });
            }
        } catch (err) {
            console.error(err);
            toggleButtonsForPdf(false);
            btn.disabled = false;
            btn.innerText = "שתף קובץ PDF 📱";
        }
    }
</script>

</body>
</html>

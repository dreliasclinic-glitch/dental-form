<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שאלון רפואי - ד"ר אליאס</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4;
            color: #064e3b;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.1);
            border: 1.5px solid #a7f3d0;
        }
        .logo-container {
            text-align: center;
            border-bottom: 2px solid #a7f3d0;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }
        .logo-container img {
            max-height: 65px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        h2 { text-align: center; color: #059669; font-size: 18px; margin: 0 0 10px 0; }
        
        fieldset {
            border: 1px solid #a7f3d0;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 8px;
            background-color: #ffffff;
        }
        legend { font-weight: bold; color: #047857; padding: 0 6px; font-size: 13px; }
        .row { display: flex; gap: 10px; margin-bottom: 6px; }
        .row:last-child { margin-bottom: 0; }
        .field { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: bold; color: #166534; margin-bottom: 3px; }
        
        input[type="text"], input[type="date"], input[type="tel"], input[type="email"] {
            padding: 6px 8px;
            border: 1px solid #a7f3d0;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #fff;
            color: #064e3b;
            width: 100%;
        }
        
        .grid-checkboxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 8px; }
        .checkbox-item { font-size: 12px; color: #14532d; display: flex; align-items: center; gap: 4px; }
        .checkbox-item input { width: 15px; height: 15px; accent-color: #059669; cursor: pointer; }

        .radio-group { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: #14532d; }
        .radio-item { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        .radio-item input { accent-color: #059669; }
        
        .sig-container { text-align: center; margin-top: 4px; }
        .canvas-wrapper {
            width: 100%;
            max-width: 500px;
            height: 140px;
            margin: 0 auto;
            position: relative;
        }
        canvas {
            border: 2px solid #059669;
            border-radius: 8px;
            background: #fafafa;
            touch-action: none;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .btn-container { text-align: center; margin-top: 12px; }
        .submit-btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 350px;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .submit-btn:active { background-color: #047857; }
        .clear-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 4px;
            margin-top: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container" id="form-content">
    <div class="logo-container">
        <img src="logo.png" alt="ד''ר אסעד אליאס" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'50\'><text x=\'50%\' y=\'50%\' font-size=\'16\' font-family=\'Arial\' text-anchor=\'middle\' fill=\'%23064e3b\' dominant-baseline=\'middle\'>ד&quot;ר אסעד אליאס - מרפאת שיניים משולבת</text></svg>';">
    </div>

    <h2>שאלון רפואי / אנמנזה</h2>

    <fieldset>
        <legend>פרטי המתרפא</legend>
        <div class="row">
            <div class="field"><label>שם משפחה:</label><input type="text" id="lname" required></div>
            <div class="field"><label>שם פרטי:</label><input type="text" id="fname" required></div>
        </div>
        <div class="row">
            <div class="field"><label>תעודת זהות:</label><input type="text" id="id_num" required></div>
            <div class="field"><label>תאריך לידה:</label><input type="date" id="dob"></div>
        </div>
        <div class="row">
            <div class="field"><label>טלפון נייד:</label><input type="tel" id="phone"></div>
            <div class="field"><label>דוא"ל:</label><input type="email" id="email"></div>
        </div>
    </fieldset>

    <fieldset>
        <legend>שאלות רפואיות</legend>
        <div class="grid-checkboxes" id="conditions-grid"></div>
    </fieldset>

    <fieldset>
        <legend>פירוט רפואי ואלרגיות</legend>
        <div class="row">
            <div class="field"><label>האם אושפזת בבית חולים? מאיזו סיבה?</label><input type="text" id="q_hosp"></div>
            <div class="field"><label>האם אלרגי לתרופות / חומרי הרדמה? לאילו?</label><input type="text" id="q_allergies"></div>
        </div>
        <div class="row">
            <div class="field"><label>האם יש אלרגיה למתכות? לאילו?</label><input type="text" id="q_metal"></div>
            <div class="field"><label>האם נוטל תרופות או גלולות קבוע? אילו?</label><input type="text" id="q_meds"></div>
        </div>
    </fieldset>

    <fieldset>
        <legend>קופת חולים, ביטוח והגעה</legend>
        <div class="row">
            <div class="field">
                <label>קופת חולים:</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="kupa" value="כללית"> כללית</label>
                    <label class="radio-item"><input type="radio" name="kupa" value="מכבי"> מכבי</label>
                    <label class="radio-item"><input type="radio" name="kupa" value="מאוחדת"> מאוחדת</label>
                    <label class="radio-item"><input type="radio" name="kupa" value="לאומית"> לאומית</label>
                </div>
            </div>
            <div class="field">
                <label>חברת ביטוח:</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="insurance" value="הראל"> הראל</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="הפניקס"> הפניקס</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="מנורה"> מנורה</label>
                    <label class="radio-item"><input type="radio" name="insurance" value="ללא"> ללא</label>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="field">
                <label>איך הגעת למרפאה?</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="arrival" value="המלצה"> המלצה</label>
                    <label class="radio-item"><input type="radio" name="arrival" value="רשתות"> רשתות</label>
                    <label class="radio-item"><input type="radio" name="arrival" value="אינטרנט"> אינטרנט</label>
                </div>
            </div>
            <div class="field">
                <label>שם הממליץ:</label>
                <input type="text" id="recommender">
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>חתימת המתרפא</legend>
        <div class="sig-container">
            <div class="canvas-wrapper">
                <canvas id="sig-canvas"></canvas>
            </div>
            <button type="button" class="clear-btn" onclick="clearSignature()">נקה חתימה</button>
        </div>
    </fieldset>

    <div class="btn-container">
        <button type="button" class="submit-btn" id="save-btn" onclick="submitForm()">שמור טופס PDF</button>
    </div>
</div>

<script>
    const conditionsList = [
        "אנמיה", "מחלת הנפילה / עצבים", "מחלות ריאות / אסטמה", "גידולים",
        "מחלות עור", "סוכרת", "סחרחורות / התעלפויות", "נטייה לדימום / קרישה",
        "הקרנות / כימותרפיה", "בהריון", "בלוטת התריס", "לחץ דם גבוה",
        "מחלות לב / רשרוש", "מום לב / מסתם", "דלקת פרקים", "מחלת כליות",
        "מחלת כבד / צהבת", "מחלות פסיכיאטריות", "חום / שלשול ממושך", "הגדלת בלוטות",
        "מחלות מין", "איידס", "הפרעות בסגירת הפה", "השתלה"
    ];
    const grid = document.getElementById('conditions-grid');
    conditionsList.forEach(cond => {
        grid.innerHTML += `<label class="checkbox-item"><input type="checkbox" value="${cond}"> ${cond}</label>`;
    });

    const canvas = document.getElementById('sig-canvas');
    let signaturePad;

    function initSignaturePad() {
        const wrapper = canvas.parentElement;
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = wrapper.clientWidth * ratio;
        canvas.height = wrapper.clientHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        
        if (!signaturePad) {
            signaturePad = new SignaturePad(canvas, { penColor: '#065f46' });
        } else {
            signaturePad.clear();
        }
    }

    window.addEventListener("load", initSignaturePad);
    window.addEventListener("resize", initSignaturePad);

    function clearSignature() { if (signaturePad) signaturePad.clear(); }

    function submitForm() {
        const fname = document.getElementById('fname').value.trim();
        const lname = document.getElementById('lname').value.trim();
        const idNum = document.getElementById('id_num').value.trim();

        if (!fname || !lname || !idNum) { 
            alert("נא למלא שם פרטי, שם משפחה ותעודת זהות."); 
            return; 
        }
        if (signaturePad && signaturePad.isEmpty()) { 
            alert("נא לחתום על גבי הטופס לפני השליחה."); 
            return; 
        }

        const btn = document.getElementById('save-btn');
        btn.disabled = true;
        btn.innerText = "מפיק קובץ PDF...";

        const filename = `הצהרת_בריאות_${lname}_${fname}_${idNum}.pdf`;
        const element = document.getElementById('form-content');

        const opt = {
            margin:       [3, 3, 3, 3],
            filename:     filename,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.disabled = false;
            btn.innerText = "שמור טופס PDF";
            alert("הטופס נשמר בהצלחה!");
            location.reload();
        }).catch(err => {
            console.error(err);
            btn.disabled = false;
            btn.innerText = "שמור טופס PDF";
            alert("אירעה שגיאה ביצירת הקובץ. נסה שוב.");
        });
    }
</script>

</body>
</html>
